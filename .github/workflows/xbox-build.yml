name: Build Xbox app

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: write

jobs:
  uwp-package:
    # Do not attempt signed packaging for pull requests from forks.
    if: github.event_name != 'pull_request'

    runs-on: windows-2022

    env:
      CERT_PASSWORD: ${{ secrets.PACKAGE_CERTIFICATE_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set package version
        shell: pwsh
        run: |
          $manifest = Join-Path `
            $env:GITHUB_WORKSPACE `
            "src/StremioXbox/Package.appxmanifest"

          $version = "1.0.${{ github.run_number }}.0"
          $contents = [System.IO.File]::ReadAllText($manifest)

          if ($contents -notmatch '(?m)^\s*<Identity\b[^>]*/>')
          {
              throw "The manifest does not contain a valid Identity element."
          }

          $identityLine =
              '  <Identity Name="StremioXbox" Publisher="CN=StremioXbox" Version="' +
              $version +
              '" />'

          $contents = [regex]::Replace(
              $contents,
              '(?m)^\s*<Identity\b[^>]*/>',
              $identityLine,
              1
          )

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          [System.IO.File]::WriteAllText(
              $manifest,
              $contents,
              $utf8NoBom
          )

          "PACKAGE_VERSION=$version" |
              Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append

      - name: Validate package manifest
        shell: pwsh
        run: |
          $manifest = Join-Path `
            $env:GITHUB_WORKSPACE `
            "src/StremioXbox/Package.appxmanifest"

          [xml]$xml = [System.IO.File]::ReadAllText($manifest)

          $identity = $xml.SelectSingleNode(
              "/*[local-name()='Package']/*[local-name()='Identity']"
          )

          if ($null -eq $identity)
          {
              throw "Package.appxmanifest still has no Identity element."
          }

          Write-Host "Manifest identity:"
          Write-Host $identity.OuterXml

      - name: Create signing certificate
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_PASSWORD))
          {
              throw "PACKAGE_CERTIFICATE_PASSWORD GitHub secret is missing."
          }

          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=StremioXbox" `
            -KeyUsage DigitalSignature `
            -FriendlyName "StremioXbox" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @(
                "2.5.29.37={text}1.3.6.1.5.5.7.3.3",
                "2.5.29.19={text}"
            )

          $password = ConvertTo-SecureString `
            -String $env:CERT_PASSWORD `
            -Force `
            -AsPlainText

          Export-PfxCertificate `
            -Cert $cert `
            -FilePath "$env:RUNNER_TEMP\StremioXbox.pfx" `
            -Password $password |
            Out-Null

          Export-Certificate `
            -Cert $cert `
            -FilePath "$env:RUNNER_TEMP\StremioXbox.cer" |
            Out-Null

      - name: Build and package Release x64
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path out |
            Out-Null

          msbuild src/StremioXbox/StremioXbox.csproj `
            /restore `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$env:RUNNER_TEMP\StremioXbox.pfx" `
            /p:PackageCertificatePassword="$env:CERT_PASSWORD" `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\out\"

      - name: Collect install files
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path dist |
            Out-Null

          Get-ChildItem out -Recurse -Include *.msix,*.appx |
            Where-Object {
              $_.FullName -notmatch '\\(arm|arm64|x86)\\'
            } |
            ForEach-Object {
              Copy-Item $_.FullName dist\
            }

          Copy-Item `
            "$env:RUNNER_TEMP\StremioXbox.cer" `
            dist\

          Get-ChildItem dist |
            Format-Table Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StremioXbox-${{ github.run_number }}
          path: dist/
          if-no-files-found: error

      - name: Publish latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest *> $null

          if ($LASTEXITCODE -eq 0)
          {
              gh release delete latest --yes --cleanup-tag
          }

          $title = "Stremio Xbox $env:PACKAGE_VERSION"

          $notes = @"
          Build $env:PACKAGE_VERSION
          Commit: ${{ github.sha }}

          Install through Xbox Device Portal:
          1. Select the StremioXbox app package.
          2. Add the other .appx files as dependencies.
          3. Install StremioXbox.cer if the certificate is requested.
          "@

          $files = Get-ChildItem dist -File |
            ForEach-Object {
              $_.FullName
            }

          gh release create latest `
            $files `
            --title $title `
            --notes $notes `
            --target ${{ github.sha }}

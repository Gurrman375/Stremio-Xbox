name: Build Xbox app

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: write

jobs:
  uwp-package:
    if: github.event_name != 'pull_request'

    runs-on: windows-2022

    env:
      CERT_PASSWORD: ${{ secrets.PACKAGE_CERTIFICATE_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set package version
        shell: pwsh
        run: |
          $manifest = "src/StremioXbox/Package.appxmanifest"
          $version = "1.0.${{ github.run_number }}.0"

          $contents = Get-Content $manifest -Raw

          $contents = [regex]::Replace(
              $contents,
              'Version="[^"]+"',
              "Version=""$version""",
              1
          )

          Set-Content `
              -Path $manifest `
              -Value $contents `
              -NoNewline

          "PACKAGE_VERSION=$version" |
              Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append

      - name: Create signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=StremioXbox" `
            -KeyUsage DigitalSignature `
            -FriendlyName "StremioXbox" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @(
                "2.5.29.37={text}1.3.6.1.5.5.7.3.3",
                "2.5.29.19={text}"
            )

          $password = ConvertTo-SecureString `
            -String $env:CERT_PASSWORD `
            -Force `
            -AsPlainText

          Export-PfxCertificate `
            -Cert $cert `
            -FilePath "$env:RUNNER_TEMP\StremioXbox.pfx" `
            -Password $password |
            Out-Null

          Export-Certificate `
            -Cert $cert `
            -FilePath "$env:RUNNER_TEMP\StremioXbox.cer" |
            Out-Null

      - name: Build and package Release x64
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path out |
            Out-Null

          msbuild src/StremioXbox/StremioXbox.csproj `
            /restore `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$env:RUNNER_TEMP\StremioXbox.pfx" `
            /p:PackageCertificatePassword="$env:CERT_PASSWORD" `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\out\"

      - name: Collect install files
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path dist |
            Out-Null

          Get-ChildItem out -Recurse -Include *.msix,*.appx |
            Where-Object {
              $_.FullName -notmatch '\\(arm|arm64|x86)\\'
            } |
            ForEach-Object {
              Copy-Item $_.FullName dist\
            }

          Copy-Item `
            "$env:RUNNER_TEMP\StremioXbox.cer" `
            dist\

          Get-ChildItem dist |
            Format-Table Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StremioXbox-${{ github.run_number }}
          path: dist/

      - name: Publish latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest *> $null

          if ($LASTEXITCODE -eq 0)
          {
              gh release delete latest --yes --cleanup-tag
          }

          $notes = @"
          Build $env:PACKAGE_VERSION from commit ${{ github.sha }}.

          Install on Xbox Developer Mode through Device Portal:
          choose the StremioXbox app package and add the other .appx files as dependencies.
          Install StremioXbox.cer if the certificate is requested.
          "@

          $title = "Stremio Xbox $env:PACKAGE_VERSION"

          $files = Get-ChildItem dist -File |
            ForEach-Object {
              $_.FullName
            }

          gh release create latest `
            $files `
            --title $title `
            --notes $notes `
            --target ${{ github.sha }}
